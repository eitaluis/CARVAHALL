name: Carvahall browser smoke test

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  chromium-render:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: npm install --no-save --package-lock=false playwright@1.55.0

      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium

      - name: Render and inspect Carvahall
        run: node tests/smoke-test.mjs

      - name: Upload browser captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carvahall-headless-preview
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
